<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lobby kasyna Vojtas Casino z fikcyjnymi żetonami.">
    <title>Vojtas Casino</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <nav class="site-nav" aria-label="Menu główne">
        <a class="site-brand" href="home.html">Vojtas <span>Casino</span></a>
        <div class="site-nav-links">
            <a href="home.html">Strona główna</a>
            <a href="index.html#automaty" aria-current="page">Automaty</a>
            <a href="roulette.html">Ruletka</a>
        </div>
        <div class="site-nav-actions">
            <button type="button" class="login-button" data-auth-action="logowania">Zaloguj się</button>
            <button type="button" class="register-button" data-auth-action="rejestracji">Zarejestruj się</button>
        </div>
        <p class="nav-notice" role="status" aria-live="polite"></p>
    </nav>
    <div class="auth-overlay" hidden>
        <section class="auth-panel" role="dialog" aria-modal="true" aria-labelledby="auth-title">
            <button class="auth-close" type="button" aria-label="Zamknij okno">X</button>
            <p class="eyebrow">Vojtas Casino</p>
            <h1 id="auth-title">Zaloguj się</h1>
            <p class="auth-description">Zaloguj się lub utwórz konto</p>

            <div class="auth-tabs" aria-label="Wybierz opcję">
                <button class="is-active" type="button" data-auth-mode="login" aria-pressed="true">Logowanie</button>
                <button type="button" data-auth-mode="register" aria-pressed="false">Rejestracja</button>
            </div>

            <form class="auth-form">
                <label for="auth-email">Adres e-mail</label>
                <input id="auth-email" type="email" placeholder="ty@przyklad.pl" autocomplete="email">

                <label for="auth-password">Hasło</label>
                <input id="auth-password" type="password" placeholder="Wpisz hasło" autocomplete="current-password">

                <button class="auth-submit" type="button">Zaloguj się</button>
            </form>

            <p class="auth-footnote">Nie masz jeszcze konta? <button type="button" data-auth-mode="register">Zarejestruj się</button></p>
        </section>
    </div>
    <div class="casino-shell lobby-shell">
        <header class="casino-header lobby-header">
            <div>
                <div class="brand-row">
                    <p class="eyebrow">Vojtas Casino</p>
                    <time id="casino-clock" class="casino-clock" aria-label="Aktualna godzina">00:00:00</time>
                </div>
                <h1>Lobby</h1>
            </div>
            <div class="balance-box" aria-label="Saldo na stronie głównej">
                <span>Saldo</span>
                <strong>1 000 <small>żetonów</small></strong>
            </div>
        </header>

        <main>
            <section id="automaty" class="game-grid" aria-label="Lista dostępnych automatów">
                <article class="game-card">
                    <div class="game-card-art" aria-hidden="true">
                        <span>🍒</span><span>🍀</span><span>⭐</span>
                    </div>
                    <div class="game-card-body">
                        <div>
                            <p class="game-type">Automat 3-bębnowy</p>
                            <h2>Lucky 3</h2>
                        </div>
                        <a class="play-button" href="slot.html">Zagraj</a>
                    </div>
                </article>

                <article class="game-card game-card-coming-soon">
                    <div class="game-card-art" aria-hidden="true">
                        <span>?</span><span>?</span><span>?</span>
                    </div>
                    <div class="game-card-body">
                        <div>
                            <p class="game-type">Wkrótce</p>
                            <h2>Nowa gra</h2>
                        </div>
                        <span class="coming-soon">Później</span>
                    </div>
                </article>
            </section>
        </main>
    </div>
</body>
</html>
