<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Prosty automat do gry za fikcyjne żetony.">
    <title>Vojtas Casino</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Vojtas Casino</h1>
        <p>Saldo: <strong id="balance">1 000</strong> żetonów</p>
    </header>

    <main>
        <h2>Automat</h2>
        <p id="reels" aria-label="Wynik losowania">
            <span>🍒</span>
            <span>🍋</span>
            <span>🍇</span>
        </p>

        <label for="bet">Zakład:</label>
        <input id="bet" type="number" min="10" step="10" value="10">
        <button id="spin" type="button">Zakręć</button>

        <p id="message" aria-live="polite">Trzy symbole wygrywają 5x, para 2x.</p>
        <p>Gra używa wyłącznie fikcyjnych żetonów.</p>
    </main>
</body>
</html>
